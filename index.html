<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>Explorador de Calles - Cobertura Comercial</title>
  
  <!-- Leaflet CSS -->
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  
  <style>
    :root {
      --bg-glass: rgba(15, 23, 42, 0.88);
      --border-glass: rgba(255, 255, 255, 0.12);
      --accent-neon: #00ff87;
      --accent-blue: #60a5fa;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      -webkit-tap-highlight-color: transparent;
    }

    html, body, #map {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #090d16;
    }

    /* Filtro CSS para convertir OpenStreetMap en Modo Oscuro Neón sin API Key */
    .leaflet-tile-container img {
      filter: invert(100%) hue-rotate(180deg) brightness(75%) contrast(150%);
    }

    /* HUD Superior de Cobertura */
    .hud-header {
      position: absolute;
      top: 14px;
      left: 14px;
      right: 14px;
      z-index: 1000;
      background: var(--bg-glass);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      border: 1px solid var(--border-glass);
      border-radius: 16px;
      padding: 14px 18px;
      color: #fff;
      display: flex;
      justify-content: space-between;
      align-items: center;
      box-shadow: 0 10px 30px rgba(0,0,0,0.5);
    }

    .hud-title {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .status-pulse {
      width: 12px;
      height: 12px;
      border-radius: 50%;
      background: #ef4444;
      transition: background 0.3s ease;
    }

    .status-pulse.active {
      background: var(--accent-neon);
      box-shadow: 0 0 12px var(--accent-neon);
      animation: pulse 1.8s infinite;
    }

    @keyframes pulse {
      0% { transform: scale(0.95); box-shadow: 0 0 0 0 rgba(0, 255, 135, 0.7); }
      70% { transform: scale(1.1); box-shadow: 0 0 0 10px rgba(0, 255, 135, 0); }
      100% { transform: scale(0.95); box-shadow: 0 0 0 0 rgba(0, 255, 135, 0); }
    }

    .hud-label {
      font-size: 11px;
      text-transform: uppercase;
      letter-spacing: 1px;
      color: #94a3b8;
      font-weight: 700;
    }

    .hud-value {
      font-size: 18px;
      font-weight: 800;
      color: #ffffff;
    }

    /* Panel Flotante Inferior */
    .controls-panel {
      position: absolute;
      bottom: 24px;
      left: 14px;
      right: 14px;
      z-index: 1000;
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .btn-main {
      width: 100%;
      padding: 16px;
      border: none;
      border-radius: 14px;
      font-size: 15px;
      font-weight: 800;
      letter-spacing: 0.5px;
      color: #090d16;
      background: var(--accent-neon);
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      box-shadow: 0 6px 20px rgba(0, 255, 135, 0.35);
      transition: all 0.2s ease;
    }

    .btn-main:active {
      transform: scale(0.97);
    }

    .btn-main.tracking {
      background: #f59e0b;
      color: #ffffff;
      box-shadow: 0 6px 20px rgba(245, 158, 11, 0.35);
    }

    .secondary-bar {
      display: flex;
      gap: 8px;
    }

    .btn-sec {
      flex: 1;
      padding: 12px;
      border: 1px solid var(--border-glass);
      border-radius: 12px;
      background: var(--bg-glass);
      backdrop-filter: blur(12px);
      color: #f8fafc;
      font-size: 13px;
      font-weight: 600;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
    }

    .btn-sec:active {
      background: rgba(255, 255, 255, 0.15);
    }

    .user-location-marker {
      width: 20px;
      height: 20px;
      background: #38bdf8;
      border: 3px solid #ffffff;
      border-radius: 50%;
      box-shadow: 0 0 15px #38bdf8;
    }
  </style>
</head>
<body>

  <div id="map"></div>

  <!-- HUD Superior -->
  <div class="hud-header">
    <div class="hud-title">
      <div id="statusDot" class="status-pulse"></div>
      <div>
        <div class="hud-label">Estado GPS</div>
        <div id="statusText" class="hud-value" style="font-size:14px;">Standby</div>
      </div>
    </div>
    <div style="text-align: right;">
      <div class="hud-label">Recorrido</div>
      <div id="distText" class="hud-value">0.00 km</div>
    </div>
  </div>

  <!-- Panel de Controles -->
  <div class="controls-panel">
    <button id="toggleBtn" class="btn-main" onclick="toggleAutoCoverage()">
      <span>🚀</span> ACTIVAR ESCANEO DE CALLES
    </button>
    <div class="secondary-bar">
      <button class="btn-sec" onclick="recenterMap()">🎯 Mi Posición</button>
      <button class="btn-sec" onclick="changeColor('#00ff87')">🟢 Verde</button>
      <button class="btn-sec" onclick="changeColor('#38bdf8')">🔵 Azul</button>
      <button class="btn-sec" onclick="clearData()" style="color:#ef4444;">🗑️ Borrar</button>
    </div>
  </div>

  <!-- Leaflet JS -->
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  
  <script>
    let map;
    let watchId = null;
    let rawCoordinates = JSON.parse(localStorage.getItem('commercial_auto_coords') || '[]');
    let activeColor = localStorage.getItem('commercial_active_color') || '#00ff87';
    
    let glowPolyline;
    let corePolyline;
    let currentMarker;
    let totalMeters = 0;

    function initApp() {
      const lastPoint = rawCoordinates.length > 0 
        ? rawCoordinates[rawCoordinates.length - 1] 
        : [42.8125, -1.6458];

      map = L.map('map', { 
        zoomControl: false, 
        attributionControl: false 
      }).setView(lastPoint, 17);

      // Servidor OpenStreetMap 100% público e ilimitado
      L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
        maxZoom: 19
      }).addTo(map);

      // Trazo de Cobertura Ancha
      glowPolyline = L.polyline(rawCoordinates, {
        color: activeColor,
        weight: 34,
        opacity: 0.5,
        lineCap: 'round',
        lineJoin: 'round'
      }).addTo(map);

      // Guía central
      corePolyline = L.polyline(rawCoordinates, {
        color: '#ffffff',
        weight: 3,
        opacity: 0.9,
        lineCap: 'round',
        lineJoin: 'round'
      }).addTo(map);

      calculateMetrics();

      if (rawCoordinates.length > 0) {
        updatePositionMarker(rawCoordinates[rawCoordinates.length - 1]);
      }
    }

      const btn = document.getElementById('toggleBtn');
      const statusDot = document.getElementById('statusDot');
      const statusText = document.getElementById('statusText');

      if (watchId !== null) {
        navigator.geolocation.clearWatch(watchId);
        watchId = null;

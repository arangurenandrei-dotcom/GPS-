<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>Explorador de Calles - Cobertura Comercial</title>
  
  <!-- Leaflet CSS -->
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  
  <style>
    :root {
      --bg-glass: rgba(15, 23, 42, 0.92);
      --border-glass: rgba(255, 255, 255, 0.15);
      --accent-neon: #00ff87;
      --accent-blue: #38bdf8;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      -webkit-tap-highlight-color: transparent;
    }

    html, body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #0f172a;
    }

    #map {
      width: 100vw;
      height: 100vh;
      position: absolute;
      top: 0;
      left: 0;
      z-index: 1;
      background: #0f172a;
    }

    /* HUD Superior de Cobertura */
    .hud-header {
      position: absolute;
      top: 14px;
      left: 14px;
      right: 14px;
      z-index: 1000;
      background: var(--bg-glass);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      border: 1px solid var(--border-glass);
      border-radius: 16px;
      padding: 14px 18px;
      color: #fff;
      display: flex;
      justify-content: space-between;
      align-items: center;
      box-shadow: 0 10px 30px rgba(0,0,0,0.5);
    }

    .hud-title {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .status-pulse {
      width: 12px;
      height: 12px;
      border-radius: 50%;
      background: #ef4444;
      transition: background 0.3s ease;
    }

    .status-pulse.active {
      background: var(--accent-neon);
      box-shadow: 0 0 12px var(--accent-neon);
      animation: pulse 1.8s infinite;
    }

    @keyframes pulse {
      0% { transform: scale(0.95); box-shadow: 0 0 0 0 rgba(0, 255, 135, 0.7); }
      70% { transform: scale(1.1); box-shadow: 0 0 0 10px rgba(0, 255, 135, 0); }
      100% { transform: scale(0.95); box-shadow: 0 0 0 0 rgba(0, 255, 135, 0); }
    }

    .hud-label {
      font-size: 11px;
      text-transform: uppercase;
      letter-spacing: 1px;
      color: #94a3b8;
      font-weight: 700;
    }

    .hud-value {
      font-size: 18px;
      font-weight: 800;
      color: #ffffff;
    }

    /* Panel Flotante Inferior */
    .controls-panel {
      position: absolute;
      bottom: 24px;
      left: 14px;
      right: 14px;
      z-index: 1000;
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .btn-main {
      width: 100%;
      padding: 16px;
      border: none;
      border-radius: 14px;
      font-size: 15px;
      font-weight: 800;
      letter-spacing: 0.5px;
      color: #090d16;
      background: var(--accent-neon);
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      box-shadow: 0 6px 20px rgba(0, 255, 135, 0.35);
      transition: all 0.2s ease;
    }

    .btn-main:active {
      transform: scale(0.97);
    }

    .btn-main.tracking {
      background: #f59e0b;
      color: #ffffff;
      box-shadow: 0 6px 20px rgba(245, 158, 11, 0.35);
    }

    .secondary-bar {
      display: flex;
      gap: 8px;
    }

    .btn-sec {
      flex: 1;
      padding: 12px;
      border: 1px solid var(--border-glass);
      border-radius: 12px;
      background: var(--bg-glass);
      backdrop-filter: blur(12px);
      color: #f8fafc;
      font-size: 13px;
      font-weight: 600;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
    }

    .btn-sec:active {
      background: rgba(255, 255, 255, 0.15);
    }

    .user-location-marker {
      width: 20px;
      height: 20px;
      background: #38bdf8;
      border: 3px solid #ffffff;
      border-radius: 50%;
      box-shadow: 0 0 15px #38bdf8;
    }
  </style>
</head>
<body>

  <div id="map"></div>

  <!-- HUD Superior -->
  <div class="hud-header">
    <div class="hud-title">
      <div id="statusDot" class="status-pulse"></div>
      <div>
        <div class="hud-label">Estado GPS</div>
        <div id="statusText" class="hud-value" style="font-size:14px;">Standby</div>
      </div>
    </div>
    <div style="text-align: right;">
      <div class="hud-label">Recorrido</div>
      <div id="distText" class="hud-value">0.00 km</div>
    </div>
  </div>

  <!-- Panel de Controles -->
  <div class="controls-panel">
    <button id="toggleBtn" class="btn-main" onclick="toggleAutoCoverage()">
      <span>🚀</span> ACTIVAR ESCANEO DE CALLES
    </button>
    <div class="secondary-bar">
      <button class="btn-sec" onclick="recenterMap()">🎯 Mi Posición</button>
      <button class="btn-sec" onclick="changeColor('#00ff87')">🟢 Verde</button>
      <button class="btn-sec" onclick="changeColor('#38bdf8')">🔵 Azul</button>
      <button class="btn-sec" onclick="clearData()" style="color:#ef4444;">🗑️ Borrar</button>
    </div>
  </div>

  <!-- Leaflet JS -->
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  
  <script>
    let map;
    let watchId = null;
    let rawCoordinates = JSON.parse(localStorage.getItem('commercial_auto_coords') || '[]');
    let activeColor = localStorage.getItem('commercial_active_color') || '#00ff87';
    
    let glowPolyline;
    let corePolyline;
    let currentMarker;
    let totalMeters = 0;

    function initApp() {
      const defaultCenter = [42.8125, -1.6458];
      const lastPoint = rawCoordinates.length > 0 
        ? rawCoordinates[rawCoordinates.length - 1] 
        : defaultCenter;

      map = L.map('map', { 
        zoomControl: false, 
        attributionControl: false 
      }).setView(lastPoint, 17);

      // Servidor Esri World Dark Gray Base (Nativamente oscuro, sin APIs ni filtros CSS)
      L.tileLayer('https://server.arcgisonline.com/ArcGIS/rest/services/Canvas/World_Dark_Gray_Base/MapServer/tile/{z}/{y}/{x}', {
        maxZoom: 19,
        maxNativeZoom: 16
      }).addTo(map);

      // Trazo de cobertura fluorescente
      glowPolyline = L.polyline(rawCoordinates, {
        color: activeColor,
        weight: 32,
        opacity: 0.65,
        lineCap: 'round',
        lineJoin: 'round'
      }).addTo(map);

      // Guía central fina
      corePolyline = L.polyline(rawCoordinates, {
        color: '#ffffff',
        weight: 3,
        opacity: 0.9,
        lineCap: 'round',
        lineJoin: 'round'
      }).addTo(map);

      calculateMetrics();

      if (rawCoordinates.length > 0) {
        updatePositionMarker(rawCoordinates[rawCoordinates.length - 1]);
      } else {
        map.locate({ setView: true, maxZoom: 17 });
      }

      // Solución para renderizado inmediato en Safari
      setTimeout(() => {
        map.invalidateSize();
      }, 300);
    }

    function toggleAutoCoverage() {
      const btn = document.getElementById('toggleBtn');
      const statusDot = document.getElementById('statusDot');
      const statusText = document.getElementById('statusText');

      if (watchId !== null) {
        navigator.geolocation.clearWatch(watchId);
        watchId = null;
        
        btn.classList.remove('tracking');
        btn.innerHTML = '<span>🚀</span> ACTIVAR ESCANEO DE CALLES';
        statusDot.classList.remove('active');
        statusText.innerText = 'Pausado';
      } else {
        if (!("geolocation" in navigator)) {
          alert("Tu dispositivo no soporta geolocalización.");
          return;
        }

        btn.classList.add('tracking');
        btn.innerHTML = '<span>⏸️</span> PAUSAR ESCANEO';
        statusDot.classList.add('active');
        statusText.innerText = 'Escaneando...';

        watchId = navigator.geolocation.watchPosition(
          handleGpsPosition,
          handleGpsError,
          {
            enableHighAccuracy: true,
            timeout: 10000,
            maximumAge: 0
          }
        );
      }
    }

    function handleGpsPosition(position) {
      const lat = position.coords.latitude;
      const lng = position.coords.longitude;
      const newPos = [lat, lng];

      if (rawCoordinates.length > 0) {
        const lastPos = rawCoordinates[rawCoordinates.length - 1];
        const dist = map.distance(lastPos, newPos);
        if (dist < 3) return;
      }

      rawCoordinates.push(newPos);
      glowPolyline.setLatLngs(rawCoordinates);
      corePolyline.setLatLngs(rawCoordinates);

      localStorage.setItem('commercial_auto_coords', JSON.stringify(rawCoordinates));

      updatePositionMarker(newPos);
      calculateMetrics();

      map.panTo(newPos, { animate: true, duration: 0.8 });
    }

    function handleGpsError(err) {
      console.warn("Error GPS: " + err.message);
    }

    function updatePositionMarker(pos) {
      if (!currentMarker) {
        const customIcon = L.divIcon({
          className: 'user-location-marker',
          iconSize: [20, 20],
          iconAnchor: [10, 10]
        });
        currentMarker = L.marker(pos, { icon: customIcon }).addTo(map);
      } else {
        currentMarker.setLatLng(pos);
      }
    }

    function recenterMap() {
      if (rawCoordinates.length > 0) {
        map.setView(rawCoordinates[rawCoordinates.length - 1], 18);
      } else {
        map.locate({ setView: true, maxZoom: 18 });
      }
      map.invalidateSize();
    }

    function changeColor(hexColor) {
      activeColor = hexColor;
      glowPolyline.setStyle({ color: activeColor });
      localStorage.setItem('commercial_active_color', activeColor);
    }

    function calculateMetrics() {
      totalMeters = 0;
      for (let i = 1; i < rawCoordinates.length; i++) {
        totalMeters += map.distance(rawCoordinates[i - 1], rawCoordinates[i]);
      }
      const km = (totalMeters / 1000).toFixed(2);
      document.getElementById('distText').innerText = `${km} km`;
    }

    function clearData() {
      if (confirm('¿Quieres limpiar todo el mapa y empezar un nuevo turno de cero?')) {
        rawCoordinates = [];
        localStorage.removeItem('commercial_auto_coords');
        glowPolyline.setLatLngs([]);
        corePolyline.setLatLngs([]);
        if (currentMarker) map.removeLayer(currentMarker);
        currentMarker = null;
        calculateMetrics();
      }
    }

    window.onload = initApp;
  </script>
</body>
</html>

<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>Rastreador Comercial GPS - Modo Bolsillo</title>
  
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  
  <style>
    :root {
      --bg-panel: rgba(18, 24, 38, 0.94);
      --border-panel: rgba(255, 255, 255, 0.15);
      --primary: #2563eb;
      --accent-green: #10b981;
      --accent-orange: #f59e0b;
      --accent-red: #ef4444;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      -webkit-tap-highlight-color: transparent;
    }

    html, body, #map {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #e5e7eb;
    }

    /* HUD Superior */
    .hud-header {
      position: absolute;
      top: 14px;
      left: 14px;
      right: 14px;
      z-index: 1000;
      background: var(--bg-panel);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      border: 1px solid var(--border-panel);
      border-radius: 16px;
      padding: 12px 18px;
      color: #ffffff;
      display: flex;
      justify-content: space-between;
      align-items: center;
      box-shadow: 0 10px 25px rgba(0, 0, 0, 0.3);
    }

    .hud-status {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .dot {
      width: 12px;
      height: 12px;
      border-radius: 50%;
      background: var(--accent-red);
      transition: background 0.3s ease;
    }

    .dot.active {
      background: var(--accent-green);
      box-shadow: 0 0 10px var(--accent-green);
      animation: pulse 1.8s infinite;
    }

    @keyframes pulse {
      0% { transform: scale(0.95); }
      70% { transform: scale(1.15); }
      100% { transform: scale(0.95); }
    }

    .hud-info {
      display: flex;
      flex-direction: column;
    }

    .hud-label {
      font-size: 10px;
      text-transform: uppercase;
      letter-spacing: 0.8px;
      color: #9ca3af;
      font-weight: 700;
    }

    .hud-value {
      font-size: 15px;
      font-weight: 700;
      color: #ffffff;
    }

    /* Panel de Controles Inferior */
    .controls-panel {
      position: absolute;
      bottom: 24px;
      left: 14px;
      right: 14px;
      z-index: 1000;
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .btn-main {
      width: 100%;
      padding: 16px;
      border: none;
      border-radius: 14px;
      font-size: 15px;
      font-weight: 800;
      color: #ffffff;
      background: var(--primary);
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      box-shadow: 0 6px 20px rgba(37, 99, 235, 0.4);
      transition: all 0.2s ease;
    }

    .btn-main:active {
      transform: scale(0.97);
    }

    .btn-main.tracking {
      background: var(--accent-orange);
      box-shadow: 0 6px 20px rgba(245, 158, 11, 0.4);
    }

    .secondary-bar {
      display: flex;
      gap: 8px;
    }

    .btn-sec {
      flex: 1;
      padding: 12px 8px;
      border: 1px solid var(--border-panel);
      border-radius: 12px;
      background: var(--bg-panel);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      color: #ffffff;
      font-size: 12px;
      font-weight: 600;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .user-marker {
      width: 18px;
      height: 18px;
      background: #2563eb;
      border: 3px solid #ffffff;
      border-radius: 50%;
      box-shadow: 0 0 12px rgba(37, 99, 235, 0.8);
    }

    /* OVERLAY MODO BOLSILLO (Pantalla Negra Anti-Toques) */
    #pocketOverlay {
      display: none;
      position: fixed;
      inset: 0;
      background: #000000;
      z-index: 99999;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      color: #333333;
      user-select: none;
      touch-action: none;
    }

    #pocketOverlay.active {
      display: flex;
    }

    .pocket-icon {
      font-size: 48px;
      margin-bottom: 12px;
      opacity: 0.3;
    }

    .pocket-text {
      font-size: 14px;
      font-weight: 600;
      letter-spacing: 1px;
      text-transform: uppercase;
      color: #444444;
      margin-bottom: 24px;
    }

    .btn-unlock {
      padding: 14px 28px;
      border: 1px solid #333333;
      border-radius: 30px;
      background: #111111;
      color: #888888;
      font-size: 13px;
      font-weight: 700;
      cursor: pointer;
    }
  </style>
</head>
<body>

  <div id="map"></div>

  <!-- Overlay de Protección de Bolsillo -->
  <div id="pocketOverlay">
    <div class="pocket-icon">🔒</div>
    <div class="pocket-text">Modo Bolsillo Activo</div>
    <button class="btn-unlock" onclick="exitPocketMode()">Mantén o Pulsa para Desbloquear</button>
  </div>

  <div class="hud-header">
    <div class="hud-status">
      <div id="statusDot" class="dot"></div>
      <div class="hud-info">
        <span class="hud-label">GPS</span>
        <span id="statusText" class="hud-value">Inactivo</span>
      </div>
    </div>
    <div class="hud-info" style="text-align: right;">
      <span class="hud-label">Recorrido</span>
      <span id="distText" class="hud-value">0.00 km</span>
    </div>
  </div>

  <div class="controls-panel">
    <button id="toggleBtn" class="btn-main" onclick="toggleTracking()">
      <span>🚀</span> INICIAR ESCANEO
    </button>
    <div class="secondary-bar">
      <button class="btn-sec" onclick="enterPocketMode()" style="background: #0f172a; border-color: #3b82f6;">🔒 Modo Bolsillo</button>
      <button class="btn-sec" onclick="recenterMap()">🎯 Posición</button>
      <button class="btn-sec" onclick="clearPath()" style="color: #ef4444;">🗑️ Limpiar</button>
    </div>
  </div>

  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

  <script>
    let map;
    let watchId = null;
    let wakeLock = null;
    let pathCoordinates = JSON.parse(localStorage.getItem('comercial_pocket_path') || '[]');
    let strokeColor = '#2563eb';

    let coveragePolyline;
    let centerLine;
    let userMarker;
    let totalMeters = 0;

    function initMap() {
      const initialPos = pathCoordinates.length > 0 
        ? pathCoordinates[pathCoordinates.length - 1] 
        : [42.8125, -1.6458];

      map = L.map('map', { 
        zoomControl: false, 
        attributionControl: false 
      }).setView(initialPos, 17);

      L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
        maxZoom: 19
      }).addTo(map);

      coveragePolyline = L.polyline(pathCoordinates, {
        color: strokeColor,
        weight: 30,
        opacity: 0.45,
        lineCap: 'round',
        lineJoin: 'round'
      }).addTo(map);

      centerLine = L.polyline(pathCoordinates, {
        color: strokeColor,
        weight: 3,
        opacity: 0.9,
        lineCap: 'round',
        lineJoin: 'round'
      }).addTo(map);

      calculateMetrics();

      if (pathCoordinates.length > 0) {
        updateUserMarker(pathCoordinates[pathCoordinates.length - 1]);
      } else {
        map.locate({ setView: true, maxZoom: 17 });
      }

      setTimeout(() => map.invalidateSize(), 300);
    }

    async function toggleTracking() {
      const btn = document.getElementById('toggleBtn');
      const statusDot = document.getElementById('statusDot');
      const statusText = document.getElementById('statusText');

      if (watchId !== null) {
        navigator.geolocation.clearWatch(watchId);
        watchId = null;
        releaseWakeLock();

        btn.classList.remove('tracking');
        btn.innerHTML = '<span>🚀</span> INICIAR ESCANEO';
        statusDot.classList.remove('active');
        statusText.innerText = 'Pausado';
      } else {
        if (!("geolocation" in navigator)) {
          alert("Tu dispositivo no soporta GPS.");
          return;
        }

        await requestWakeLock();

        btn.classList.add('tracking');
        btn.innerHTML = '<span>⏸️</span> PAUSAR ESCANEO';
        statusDot.classList.add('active');
        statusText.innerText = 'Rastreando...';

        watchId = navigator.geolocation.watchPosition(
          onGpsSuccess,
          onGpsError,
          {
            enableHighAccuracy: true,
            timeout: 15000,
            maximumAge: 0
          }
        );
      }
    }

    async function requestWakeLock() {
      try {
        if ('wakeLock' in navigator) {
          wakeLock = await navigator.wakeLock.request('screen');
        }
      } catch (err) {
        console.warn('Wake Lock no disponible:', err);
      }
    }

    function releaseWakeLock() {
      if (wakeLock !== null) {
        wakeLock.release();
        wakeLock = null;
      }
    }

    function enterPocketMode() {
      requestWakeLock();
      document.getElementById('pocketOverlay').classList.add('active');
    }

    function exitPocketMode() {
      document.getElementById('pocketOverlay').classList.remove('active');
    }

    function onGpsSuccess(position) {
      const lat = position.coords.latitude;
      const lng = position.coords.longitude;
      const newPos = [lat, lng];

      if (pathCoordinates.length > 0) {
        const lastPos = pathCoordinates[pathCoordinates.length - 1];
        const dist = map.distance(lastPos, newPos);
        if (dist < 3) return;
      }

      pathCoordinates.push(newPos);
      coveragePolyline.setLatLngs(pathCoordinates);
      centerLine.setLatLngs(pathCoordinates);

      localStorage.setItem('comercial_pocket_path', JSON.stringify(pathCoordinates));

      updateUserMarker(newPos);
      calculateMetrics();

      map.panTo(newPos, { animate: true, duration: 0.8 });
    }

    function onGpsError(err) {
      console.warn("GPS:", err.message);
    }

    function updateUserMarker(pos) {
      if (!userMarker) {
        const customIcon = L.divIcon({
          className: 'user-marker',
          iconSize: [18, 18],
          iconAnchor: [9, 9]
        });
        userMarker = L.marker(pos, { icon: customIcon }).addTo(map);
      } else {
        userMarker.setLatLng(pos);
      }
    }

    function recenterMap() {
      if (pathCoordinates.length > 0) {
        map.setView(pathCoordinates[pathCoordinates.length - 1], 18);
      } else {
        map.locate({ setView: true, maxZoom: 18 });
      }
      map.invalidateSize();
    }

    function calculateMetrics() {
      totalMeters = 0;
      for (let i = 1; i < pathCoordinates.length; i++) {
        totalMeters += map.distance(pathCoordinates[i - 1], pathCoordinates[i]);
      }
      const km = (totalMeters / 1000).toFixed(2);
      document.getElementById('distText').innerText = `${km} km`;
    }

    function clearPath() {
      if (confirm('¿Quieres limpiar el mapa?')) {
        pathCoordinates = [];
        localStorage.removeItem('comercial_pocket_path');
        coveragePolyline.setLatLngs([]);
        centerLine.setLatLngs([]);
        if (userMarker) map.removeLayer(userMarker);
        userMarker = null;
        calculateMetrics();
      }
    }

    window.onload = initMap;
  </script>
</body>
</html>

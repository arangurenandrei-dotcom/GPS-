<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>Rastreador Comercial Profesional</title>
  
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  
  <style>
    :root {
      --bg-panel: rgba(15, 23, 42, 0.94);
      --border-panel: rgba(255, 255, 255, 0.12);
      --primary: #2563eb;
      --accent-green: #10b981;
      --accent-orange: #f59e0b;
      --accent-red: #ef4444;
      --accent-gray: #64748b;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      -webkit-tap-highlight-color: transparent;
    }

    html, body, #map {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #f8fafc;
    }

    /* HUD Superior */
    .hud-header {
      position: absolute;
      top: 14px;
      left: 14px;
      right: 14px;
      z-index: 1000;
      background: var(--bg-panel);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      border: 1px solid var(--border-panel);
      border-radius: 16px;
      padding: 12px 18px;
      color: #ffffff;
      display: flex;
      justify-content: space-between;
      align-items: center;
      box-shadow: 0 10px 25px rgba(0, 0, 0, 0.25);
    }

    .hud-status {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .dot {
      width: 12px;
      height: 12px;
      border-radius: 50%;
      background: var(--accent-red);
      transition: background 0.3s ease;
    }

    .dot.active {
      background: var(--accent-green);
      box-shadow: 0 0 10px var(--accent-green);
      animation: pulse 1.8s infinite;
    }

    @keyframes pulse {
      0% { transform: scale(0.95); }
      70% { transform: scale(1.15); }
      100% { transform: scale(0.95); }
    }

    .hud-info {
      display: flex;
      flex-direction: column;
    }

    .hud-label {
      font-size: 10px;
      text-transform: uppercase;
      letter-spacing: 0.8px;
      color: #94a3b8;
      font-weight: 700;
    }

    .hud-value {
      font-size: 15px;
      font-weight: 700;
      color: #ffffff;
    }

    /* Indicador del Modo Pincel Manual */
    .brush-banner {
      display: none;
      position: absolute;
      top: 80px;
      left: 14px;
      right: 14px;
      z-index: 1000;
      background: rgba(37, 99, 235, 0.95);
      border-radius: 12px;
      padding: 10px;
      color: white;
      font-size: 12px;
      font-weight: 700;
      text-align: center;
      box-shadow: 0 4px 15px rgba(0,0,0,0.3);
    }

    .brush-banner.active {
      display: block;
    }

    /* Panel de Controles Inferior */
    .controls-panel {
      position: absolute;
      bottom: 24px;
      left: 14px;
      right: 14px;
      z-index: 1000;
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    .btn-main {
      width: 100%;
      padding: 15px;
      border: none;
      border-radius: 14px;
      font-size: 14px;
      font-weight: 800;
      color: #ffffff;
      background: var(--primary);
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      box-shadow: 0 6px 20px rgba(37, 99, 235, 0.35);
      transition: all 0.2s ease;
    }

    .btn-main:active {
      transform: scale(0.97);
    }

    .btn-main.tracking {
      background: var(--accent-orange);
      box-shadow: 0 6px 20px rgba(245, 158, 11, 0.35);
    }

    .btn-main.brush-active {
      background: #8b5cf6;
      box-shadow: 0 6px 20px rgba(139, 92, 246, 0.35);
    }

    .secondary-bar {
      display: flex;
      gap: 6px;
    }

    .btn-sec {
      flex: 1;
      padding: 11px 4px;
      border: 1px solid var(--border-panel);
      border-radius: 12px;
      background: var(--bg-panel);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      color: #ffffff;
      font-size: 11px;
      font-weight: 600;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 4px;
    }

    .user-marker {
      width: 16px;
      height: 16px;
      background: #2563eb;
      border: 3px solid #ffffff;
      border-radius: 50%;
      box-shadow: 0 0 10px rgba(37, 99, 235, 0.8);
    }

    /* OVERLAY MODO BOLSILLO */
    #pocketOverlay {
      display: none;
      position: fixed;
      inset: 0;
      background: #000000;
      z-index: 99999;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      color: #333333;
      user-select: none;
      touch-action: none;
    }

    #pocketOverlay.active {
      display: flex;
    }

    .pocket-icon {
      font-size: 48px;
      margin-bottom: 12px;
      opacity: 0.3;
    }

    .pocket-text {
      font-size: 13px;
      font-weight: 600;
      letter-spacing: 1px;
      text-transform: uppercase;
      color: #444444;
      margin-bottom: 24px;
    }

    .btn-unlock {
      padding: 14px 28px;
      border: 1px solid #333333;
      border-radius: 30px;
      background: #111111;
      color: #888888;
      font-size: 13px;
      font-weight: 700;
    }
  </style>
</head>
<body>

  <div id="map"></div>

  <!-- Banner Informativo del Modo Pincel -->
  <div id="brushBanner" class="brush-banner">
    ✏️ Modo Pincel: Toca el INICIO y FIN de una calle para pintarla limpia.
  </div>

  <!-- Pantalla Negra Anti-Toques -->
  <div id="pocketOverlay">
    <div class="pocket-icon">🔒</div>
    <div class="pocket-text">Rastreando Calles...</div>
    <button class="btn-unlock" onclick="exitPocketMode()">Pulsa para Desbloquear</button>
  </div>

  <!-- HUD Superior -->
  <div class="hud-header">
    <div class="hud-status">
      <div id="statusDot" class="dot"></div>
      <div class="hud-info">
        <span class="hud-label">GPS</span>
        <span id="statusText" class="hud-value">Standby</span>
      </div>
    </div>
    <div class="hud-info" style="text-align: right;">
      <span class="hud-label">Recorrido</span>
      <span id="distText" class="hud-value">0.00 km</span>
    </div>
  </div>

  <!-- Panel Inferior -->
  <div class="controls-panel">
    <button id="toggleBtn" class="btn-main" onclick="toggleTracking()">
      <span>🚀</span> INICIAR ESCANEO GPS
    </button>
    
    <div class="secondary-bar">
      <button id="brushBtn" class="btn-sec" onclick="toggleBrushMode()" style="background: #1e1b4b; border-color: #6366f1;">
        🖊️ Marcar Calle
      </button>
      <button class="btn-sec" onclick="enterPocketMode()" style="background: #0f172a;">
        🔒 Bolsillo
      </button>
      <button class="btn-sec" onclick="recenterMap()">
        🎯 Posición
      </button>
      <button class="btn-sec" onclick="clearPath()" style="color: #ef4444;">
        🗑️ Limpiar
      </button>
    </div>
  </div>

  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

  <script>
    let map;
    let watchId = null;
    let wakeLock = null;
    let isBrushMode = false;
    let manualPoints = [];

    let pathCoordinates = JSON.parse(localStorage.getItem('comercial_clean_path') || '[]');
    let manualStreets = JSON.parse(localStorage.getItem('comercial_manual_streets') || '[]');

    let coveragePolyline;
    let centerLine;
    let userMarker;
    let totalMeters = 0;

    function initMap() {
      const initialPos = pathCoordinates.length > 0 
        ? pathCoordinates[pathCoordinates.length - 1] 
        : [42.8125, -1.6458];

      map = L.map('map', { 
        zoomControl: false, 
        attributionControl: false 
      }).setView(initialPos, 17);

      // Mapbox / OpenStreetMap limpio
      L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
        maxZoom: 19
      }).addTo(map);

      // Trazo de Cobertura GPS Suavizado
      coveragePolyline = L.polyline(pathCoordinates, {
        color: '#2563eb',
        weight: 22,
        opacity: 0.4,
        lineCap: 'round',
        lineJoin: 'round',
        smoothFactor: 3.0 // Suaviza las aristas del GPS
      }).addTo(map);

      centerLine = L.polyline(pathCoordinates, {
        color: '#1d4ed8',
        weight: 3,
        opacity: 0.85,
        lineCap: 'round',
        lineJoin: 'round',
        smoothFactor: 3.0
      }).addTo(map);

      // Cargar calles marcadas manualmente
      manualStreets.forEach(street => renderManualStreet(street));

      calculateMetrics();

      if (pathCoordinates.length > 0) {
        updateUserMarker(pathCoordinates[pathCoordinates.length - 1]);
      } else {
        map.locate({ setView: true, maxZoom: 17 });
      }

      // Listener para el marcado manual con clics/taps en el mapa
      map.on('click', handleMapClick);

      setTimeout(() => map.invalidateSize(), 300);
    }

    function toggleTracking() {
      const btn = document.getElementById('toggleBtn');
      const statusDot = document.getElementById('statusDot');
      const statusText = document.getElementById('statusText');

      if (watchId !== null) {
        navigator.geolocation.clearWatch(watchId);
        watchId = null;
        releaseWakeLock();

        btn.classList.remove('tracking');
        btn.innerHTML = '<span>🚀</span> INICIAR ESCANEO GPS';
        statusDot.classList.remove('active');
        statusText.innerText = 'Pausado';
      } else {
        if (!("geolocation" in navigator)) {
          alert("Tu dispositivo no soporta GPS.");
          return;
        }

        requestWakeLock();

        btn.classList.add('tracking');
        btn.innerHTML = '<span>⏸️</span> PAUSAR ESCANEO';
        statusDot.classList.add('active');
        statusText.innerText = 'Escaneando...';

        watchId = navigator.geolocation.watchPosition(
          onGpsSuccess,
          onGpsError,
          {
            enableHighAccuracy: true,
            timeout: 10000,
            maximumAge: 0
          }
        );
      }
    }

    function onGpsSuccess(position) {
      // FILTRO 1: Descartar mediciones con baja precisión (>25m de margen de error)
      if (position.coords.accuracy > 25) return;

      const lat = position.coords.latitude;
      const lng = position.coords.longitude;
      const newPos = [lat, lng];

      // FILTRO 2: Descartar saltos mínimos de menos de 8 metros para evitar dientes de sierra
      if (pathCoordinates.length > 0) {
        const lastPos = pathCoordinates[pathCoordinates.length - 1];
        const dist = map.distance(lastPos, newPos);
        if (dist < 8) return; 
      }

      pathCoordinates.push(newPos);
      coveragePolyline.setLatLngs(pathCoordinates);
      centerLine.setLatLngs(pathCoordinates);

      localStorage.setItem('comercial_clean_path', JSON.stringify(pathCoordinates));

      updateUserMarker(newPos);
      calculateMetrics();

      map.panTo(newPos, { animate: true, duration: 0.8 });
    }

    // --- MODO PINCEL / MARCAR CALLE MANUALMENTE ---
    function toggleBrushMode() {
      isBrushMode = !isBrushMode;
      const brushBtn = document.getElementById('brushBtn');
      const banner = document.getElementById('brushBanner');

      if (isBrushMode) {
        manualPoints = [];
        brushBtn.style.background = '#8b5cf6';
        brushBtn.innerText = '❌ Cancelar Pincel';
        banner.classList.add('active');
      } else {
        manualPoints = [];
        brushBtn.style.background = '#1e1b4b';
        brushBtn.innerText = '🖊️ Marcar Calle';
        banner.classList.remove('active');
      }
    }

    function handleMapClick(e) {
      if (!isBrushMode) return;

      manualPoints.push([e.latlng.lat, e.latlng.lng]);

      if (manualPoints.length === 1) {
        // Primer toque: Marcar punto de inicio
        L.circleMarker(manualPoints[0], { radius: 5, color: '#8b5cf6' }).addTo(map);
      } else if (manualPoints.length === 2) {
        // Segundo toque: Trazar la calle recta
        const tipo = confirm("¿Es una calle completada (Aceptar = Azul) o una calle de Garajes/Sin portales (Cancelar = Gris)?") 
          ? 'completada' 
          : 'garaje';

        const streetData = {
          coords: [manualPoints[0], manualPoints[1]],
          tipo: tipo
        };

        manualStreets.push(streetData);
        localStorage.setItem('comercial_manual_streets', JSON.stringify(manualStreets));
        renderManualStreet(streetData);

        // Resetear modo pincel
        toggleBrushMode();
      }
    }

    function renderManualStreet(street) {
      const isGarage = street.tipo === 'garaje';
      const strokeColor = isGarage ? '#64748b' : '#2563eb';
      const dashPattern = isGarage ? '8, 8' : null;

      // Trazo ancho limpio de calle trazada a mano
      L.polyline(street.coords, {
        color: strokeColor,
        weight: isGarage ? 18 : 22,
        opacity: isGarage ? 0.5 : 0.6,
        dashArray: dashPattern,
        lineCap: 'round'
      }).addTo(map);

      // Eje central
      L.polyline(street.coords, {
        color: isGarage ? '#475569' : '#1d4ed8',
        weight: 3,
        opacity: 0.9
      }).addTo(map);
    }

    // --- MODO BOLSILLO & AUXILIARES ---
    async function requestWakeLock() {
      try {
        if ('wakeLock' in navigator) {
          wakeLock = await navigator.wakeLock.request('screen');
        }
      } catch (err) {
        console.warn('Wake Lock no disponible:', err);
      }
    }

    function releaseWakeLock() {
      if (wakeLock !== null) {
        wakeLock.release();
        wakeLock = null;
      }
    }

    function enterPocketMode() {
      requestWakeLock();
      document.getElementById('pocketOverlay').classList.add('active');
    }

    function exitPocketMode() {
      document.getElementById('pocketOverlay').classList.remove('active');
    }

    function onGpsError(err) {
      console.warn("GPS:", err.message);
    }

    function updateUserMarker(pos) {
      if (!userMarker) {
        const customIcon = L.divIcon({
          className: 'user-marker',
          iconSize: [16, 16],
          iconAnchor: [8, 8]
        });
        userMarker = L.marker(pos, { icon: customIcon }).addTo(map);
      } else {
        userMarker.setLatLng(pos);
      }
    }

    function recenterMap() {
      if (pathCoordinates.length > 0) {
        map.setView(pathCoordinates[pathCoordinates.length - 1], 18);
      } else {
        map.locate({ setView: true, maxZoom: 18 });
      }
      map.invalidateSize();
    }

    function calculateMetrics() {
      totalMeters = 0;
      for (let i = 1; i < pathCoordinates.length; i++) {
        totalMeters += map.distance(pathCoordinates[i - 1], pathCoordinates[i]);
      }
      const km = (totalMeters / 1000).toFixed(2);
      document.getElementById('distText').innerText = `${km} km`;
    }

    function clearPath() {
      if (confirm('¿Quieres limpiar todas las calles del mapa para empezar una nueva zona?')) {
        pathCoordinates = [];
        manualStreets = [];
        localStorage.removeItem('comercial_clean_path');
        localStorage.removeItem('comercial_manual_streets');
        location.reload();
      }
    }

    window.onload = initMap;
  </script>
</body>
</html>

<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>Rastreador Comercial GPS</title>
  
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  
  <style>
    :root {
      --bg-panel: rgba(15, 23, 42, 0.94);
      --border-panel: rgba(255, 255, 255, 0.15);
      --primary: #2563eb;
      --accent-green: #10b981;
      --accent-orange: #f59e0b;
      --accent-red: #ef4444;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      -webkit-tap-highlight-color: transparent;
    }

    html, body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #f8fafc;
    }

    #map {
      width: 100vw;
      height: 100vh;
      position: absolute;
      top: 0;
      left: 0;
      z-index: 1;
      background: #e2e8f0;
    }

    /* HUD Superior */
    .hud-header {
      position: absolute;
      top: 14px;
      left: 14px;
      right: 14px;
      z-index: 2000;
      background: var(--bg-panel);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      border: 1px solid var(--border-panel);
      border-radius: 16px;
      padding: 12px 18px;
      color: #ffffff;
      display: flex;
      justify-content: space-between;
      align-items: center;
      box-shadow: 0 10px 25px rgba(0, 0, 0, 0.25);
      pointer-events: auto;
    }

    .hud-status {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .dot {
      width: 12px;
      height: 12px;
      border-radius: 50%;
      background: var(--accent-red);
      transition: background 0.3s ease;
    }

    .dot.active {
      background: var(--accent-green);
      box-shadow: 0 0 10px var(--accent-green);
      animation: pulse 1.8s infinite;
    }

    @keyframes pulse {
      0% { transform: scale(0.95); }
      70% { transform: scale(1.15); }
      100% { transform: scale(0.95); }
    }

    .hud-info {
      display: flex;
      flex-direction: column;
    }

    .hud-label {
      font-size: 10px;
      text-transform: uppercase;
      letter-spacing: 0.8px;
      color: #94a3b8;
      font-weight: 700;
    }

    .hud-value {
      font-size: 15px;
      font-weight: 700;
      color: #ffffff;
    }

    /* Banner de Modo */
    .mode-banner {
      display: none;
      position: absolute;
      top: 76px;
      left: 14px;
      right: 14px;
      z-index: 2000;
      background: rgba(37, 99, 235, 0.95);
      border-radius: 12px;
      padding: 10px 14px;
      color: white;
      font-size: 12px;
      font-weight: 700;
      align-items: center;
      justify-content: space-between;
      box-shadow: 0 4px 15px rgba(0,0,0,0.3);
      pointer-events: auto;
    }

    .mode-banner.active {
      display: flex;
    }

    .btn-action-banner {
      padding: 6px 12px;
      border: none;
      border-radius: 8px;
      background: #ffffff;
      color: #2563eb;
      font-size: 11px;
      font-weight: 800;
      cursor: pointer;
    }

    /* Panel de Controles Inferior */
    .controls-panel {
      position: absolute;
      bottom: 24px;
      left: 14px;
      right: 14px;
      z-index: 2000;
      display: flex;
      flex-direction: column;
      gap: 8px;
      pointer-events: auto;
    }

    .btn-main {
      width: 100%;
      padding: 15px;
      border: none;
      border-radius: 14px;
      font-size: 14px;
      font-weight: 800;
      color: #ffffff;
      background: var(--primary);
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      box-shadow: 0 6px 20px rgba(37, 99, 235, 0.35);
      transition: all 0.2s ease;
    }

    .btn-main:active {
      transform: scale(0.97);
    }

    .btn-main.tracking {
      background: var(--accent-orange);
      box-shadow: 0 6px 20px rgba(245, 158, 11, 0.35);
    }

    .secondary-bar {
      display: flex;
      gap: 6px;
    }

    .btn-sec {
      flex: 1;
      padding: 11px 4px;
      border: 1px solid var(--border-panel);
      border-radius: 12px;
      background: var(--bg-panel);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      color: #ffffff;
      font-size: 11px;
      font-weight: 600;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 4px;
    }

    .user-marker {
      width: 16px;
      height: 16px;
      background: #2563eb;
      border: 3px solid #ffffff;
      border-radius: 50%;
      box-shadow: 0 0 10px rgba(37, 99, 235, 0.8);
    }

    /* Pantalla Negra Bolsillo */
    #pocketOverlay {
      display: none;
      position: fixed;
      inset: 0;
      background: #000000;
      z-index: 99999;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      color: #333333;
      user-select: none;
      touch-action: none;
    }

    #pocketOverlay.active {
      display: flex;
    }

    .pocket-icon {
      font-size: 48px;
      margin-bottom: 12px;
      opacity: 0.3;
    }

    .pocket-text {
      font-size: 13px;
      font-weight: 600;
      letter-spacing: 1px;
      text-transform: uppercase;
      color: #444444;
      margin-bottom: 24px;
    }

    .btn-unlock {
      padding: 14px 28px;
      border: 1px solid #333333;
      border-radius: 30px;
      background: #111111;
      color: #888888;
      font-size: 13px;
      font-weight: 700;
    }
  </style>
</head>
<body>

  <div id="map"></div>

  <!-- Banner Informativo -->
  <div id="modeBanner" class="mode-banner">
    <span id="bannerText">🔷 Toca las 4 esquinas de la manzana...</span>
    <button id="btnBannerAction" class="btn-action-banner" onclick="confirmAction()">RELLENAR</button>
  </div>

  <!-- Pantalla Negra Bolsillo -->
  <div id="pocketOverlay">
    <div class="pocket-icon">🔒</div>
    <div class="pocket-text">Rastreando Manzanas...</div>
    <button class="btn-unlock" onclick="exitPocketMode()">Pulsa para Desbloquear</button>
  </div>

  <!-- HUD Superior -->
  <div class="hud-header">
    <div class="hud-status">
      <div id="statusDot" class="dot"></div>
      <div class="hud-info">
        <span class="hud-label">GPS</span>
        <span id="statusText" class="hud-value">Standby</span>
      </div>
    </div>
    <div class="hud-info" style="text-align: right;">
      <span class="hud-label">Recorrido</span>
      <span id="distText" class="hud-value">0.00 km</span>
    </div>
  </div>

  <!-- Panel Inferior -->
  <div class="controls-panel">
    <button id="toggleBtn" class="btn-main" onclick="toggleTracking()">
      <span>🚀</span> INICIAR ESCANEO GPS
    </button>
    
    <div class="secondary-bar">
      <button id="btnFill" class="btn-sec" onclick="startBlockFillMode()" style="background: #1e3a8a; border-color: #3b82f6;">
        🔷 Rellenar Manzana
      </button>
      <button id="btnStreet" class="btn-sec" onclick="startStreetMode()" style="background: #1e1b4b; border-color: #6366f1;">
        🖊️ Marcar Calle
      </button>
      <button class="btn-sec" onclick="enterPocketMode()" style="background: #0f172a;">
        🔒 Bolsillo
      </button>
      <button class="btn-sec" onclick="clearPath()" style="color: #ef4444;">
        🗑️ Limpiar
      </button>
    </div>
  </div>

  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

  <script>
    let map;
    let watchId = null;
    let wakeLock = null;
    let currentMode = null;
    let tempPoints = [];
    let tempMarkers = [];

    let pathCoordinates = [];
    let savedBlocks = [];
    let savedStreets = [];

    let coveragePolyline;
    let centerLine;
    let userMarker;

    // LECTURA SEGURA DE LOCALSTORAGE (Previene cuelgues)
    function safeLoadStorage(key) {
      try {
        const item = localStorage.getItem(key);
        return item ? JSON.parse(item) : [];
      } catch (e) {
        console.warn("Dato corrupto limpiado:", key);
        localStorage.removeItem(key);
        return [];
      }
    }

    function initMap() {
      // Cargar datos con protección anti-errores
      pathCoordinates = safeLoadStorage('comercial_gps_path');
      savedBlocks = safeLoadStorage('comercial_blocks');
      savedStreets = safeLoadStorage('comercial_streets');

      const initialPos = pathCoordinates.length > 0 
        ? pathCoordinates[pathCoordinates.length - 1] 
        : [42.8125, -1.6458];

      // Inicialización del mapa
      map = L.map('map', { 
        zoomControl: false, 
        attributionControl: false 
      }).setView(initialPos, 17);

      L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
        maxZoom: 19
      }).addTo(map);

      // Líneas de trayecto
      coveragePolyline = L.polyline(pathCoordinates, {
        color: '#2563eb',
        weight: 22,
        opacity: 0.45,
        lineCap: 'round',
        lineJoin: 'round',
        smoothFactor: 2.5
      }).addTo(map);

      centerLine = L.polyline(pathCoordinates, {
        color: '#1d4ed8',
        weight: 3,
        opacity: 0.85,
        lineCap: 'round',
        lineJoin: 'round',
        smoothFactor: 2.5
      }).addTo(map);

      // Renderizar datos guardados sin bloquear el hilo JS
      if (Array.isArray(savedBlocks)) {
        savedBlocks.forEach(coords => {
          if (coords && coords.length > 0) renderBlockPolygon(coords);
        });
      }

      if (Array.isArray(savedStreets)) {
        savedStreets.forEach(street => {
          if (street && street.length > 0) renderStreetLine(street);
        });
      }

      calculateMetrics();

      if (pathCoordinates.length > 0) {
        updateUserMarker(pathCoordinates[pathCoordinates.length - 1]);
      } else {
        map.locate({ setView: true, maxZoom: 17 });
      }

      map.on('click', handleMapClick);

      // Refresco de renderizado para iOS Safari
      setTimeout(() => {
        if (map) map.invalidateSize();
      }, 300);
    }

    function toggleTracking() {
      const btn = document.getElementById('toggleBtn');
      const statusDot = document.getElementById('statusDot');
      const statusText = document.getElementById('statusText');

      if (watchId !== null) {
        navigator.geolocation.clearWatch(watchId);
        watchId = null;
        releaseWakeLock();

        btn.classList.remove('tracking');
        btn.innerHTML = '<span>🚀</span> INICIAR ESCANEO GPS';
        statusDot.classList.remove('active');
        statusText.innerText = 'Pausado';
      } else {
        if (!("geolocation" in navigator)) {
          alert("Tu dispositivo no soporta GPS.");
          return;
        }

        requestWakeLock();

        btn.classList.add('tracking');
        btn.innerHTML = '<span>⏸️</span> PAUSAR ESCANEO';
        statusDot.classList.add('active');
        statusText.innerText = 'Escaneando...';

        watchId = navigator.geolocation.watchPosition(
          onGpsSuccess,
          onGpsError,
          {
            enableHighAccuracy: true,
            timeout: 10000,
            maximumAge: 0
          }
        );
      }
    }

    function onGpsSuccess(position) {
      if (position.coords.accuracy > 25) return;

      const lat = position.coords.latitude;
      const lng = position.coords.longitude;
      const newPos = [lat, lng];

      if (pathCoordinates.length > 0) {
        const lastPos = pathCoordinates[pathCoordinates.length - 1];
        const dist = map.distance(lastPos, newPos);
        if (dist < 6) return; 
      }

      pathCoordinates.push(newPos);
      coveragePolyline.setLatLngs(pathCoordinates);
      centerLine.setLatLngs(pathCoordinates);

      try {
        localStorage.setItem('comercial_gps_path', JSON.stringify(pathCoordinates));
      } catch(e){}

      updateUserMarker(newPos);
      calculateMetrics();

      map.panTo(newPos, { animate: true, duration: 0.8 });
    }

    function startBlockFillMode() {
      resetModes();
      currentMode = 'block';
      document.getElementById('modeBanner').classList.add('active');
      document.getElementById('bannerText').innerText = '🔷 Toca las esquinas de la manzana...';
      document.getElementById('btnBannerAction').style.display = 'inline-block';
    }

    function startStreetMode() {
      resetModes();
      currentMode = 'street';
      document.getElementById('modeBanner').classList.add('active');
      document.getElementById('bannerText').innerText = '🖊️ Toca inicio y fin de la calle...';
      document.getElementById('btnBannerAction').style.display = 'none';
    }

    function resetModes() {
      currentMode = null;
      tempPoints = [];
      tempMarkers.forEach(m => map.removeLayer(m));
      tempMarkers = [];
      document.getElementById('modeBanner').classList.remove('active');
    }

    function handleMapClick(e) {
      if (!currentMode) return;

      const point = [e.latlng.lat, e.latlng.lng];
      tempPoints.push(point);

      const marker = L.circleMarker(point, { radius: 6, color: '#2563eb', fillColor: '#ffffff', fillOpacity: 1 }).addTo(map);
      tempMarkers.push(marker);

      if (currentMode === 'street' && tempPoints.length === 2) {
        savedStreets.push(tempPoints);
        try {
          localStorage.setItem('comercial_streets', JSON.stringify(savedStreets));
        } catch(e){}
        renderStreetLine(tempPoints);
        resetModes();
      }
    }

    function confirmAction() {
      if (currentMode === 'block') {
        if (tempPoints.length < 3) {
          alert("Toca al menos 3 esquinas en el mapa para delimitar la manzana que quieres rellenar.");
          return;
        }
        savedBlocks.push(tempPoints);
        try {
          localStorage.setItem('comercial_blocks', JSON.stringify(savedBlocks));
        } catch(e){}
        renderBlockPolygon(tempPoints);
        resetModes();
      }
    }

    function renderBlockPolygon(coords) {
      L.polygon(coords, {
        color: '#1d4ed8',
        weight: 3,
        fillColor: '#3b82f6',
        fillOpacity: 0.45
      }).addTo(map);
    }

    function renderStreetLine(coords) {
      L.polyline(coords, {
        color: '#2563eb',
        weight: 22,
        opacity: 0.45,
        lineCap: 'round'
      }).addTo(map);

      L.polyline(coords, {
        color: '#1d4ed8',
        weight: 3,
        opacity: 0.9
      }).addTo(map);
    }

    async function requestWakeLock() {
      try {
        if ('wakeLock' in navigator) {
          wakeLock = await navigator.wakeLock.request('screen');
        }
      } catch (err) {}
    }

    function releaseWakeLock() {
      if (wakeLock !== null) {
        wakeLock.release();
        wakeLock = null;
      }
    }

    function enterPocketMode() {
      requestWakeLock();
      document.getElementById('pocketOverlay').classList.add('active');
    }

    function exitPocketMode() {
      document.getElementById('pocketOverlay').classList.remove('active');
    }

    function onGpsError(err) {
      console.warn("GPS:", err.message);
    }

    function updateUserMarker(pos) {
      if (!userMarker) {
        const customIcon = L.divIcon({
          className: 'user-marker',
          iconSize: [16, 16],
          iconAnchor: [8, 8]
        });
        userMarker = L.marker(pos, { icon: customIcon }).addTo(map);
      } else {
        userMarker.setLatLng(pos);
      }
    }

    function recenterMap() {
      if (pathCoordinates.length > 0) {
        map.setView(pathCoordinates[pathCoordinates.length - 1], 18);
      } else {
        map.locate({ setView: true, maxZoom: 18 });
      }
      if (map) map.invalidateSize();
    }

    function calculateMetrics() {
      let totalMeters = 0;
      for (let i = 1; i < pathCoordinates.length; i++) {
        totalMeters += map.distance(pathCoordinates[i - 1], pathCoordinates[i]);
      }
      const km = (totalMeters / 1000).toFixed(2);
      document.getElementById('distText').innerText = `${km} km`;
    }

    function clearPath() {
      if (confirm('¿Quieres limpiar todo el mapa y borrar los datos acumulados?')) {
        localStorage.clear();
        location.reload();
      }
    }

    window.onload = initMap;
  </script>
</body>
</html>

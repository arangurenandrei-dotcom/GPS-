function alertCount(){return visibleAlerts().filter(function(a){return !a.read;}).length;}
function log(title,detail){db.logs.unshift({id:'l'+(++db.nextId),title:title,detail:detail});}
function notify(floor,kind,title,detail){db.alerts.unshift({id:'a'+(++db.nextId),floor:floor,kind:kind,title:title,detail:detail,read:false});}
function go(p,id){page=p;if(id)floor=id;tab='resumen';save();render();}
function showToast(t){var root=document.getElementById('toast-root');root.innerHTML='<div class="toast">'+safe(t)+'</div>';clearTimeout(window.__toastTimer);window.__toastTimer=setTimeout(function(){root.innerHTML='';},3000);}
function button(label,act,kind){return '<button class="button '+(kind||'')+'" data-action="'+safe(act)+'">'+safe(label)+'</button>';}
function pTag(text,cl){return '<span class="pill '+(cl||'')+'">'+safe(text)+'</span>';}
function stat(value,title,sub){return '<div class="stat"><strong>'+safe(value)+'</strong><span>'+safe(title)+'</span>'+(sub?'<small>'+safe(sub)+'</small>':'')+'</div>';}
function section(title,sub){return '<div class="section-title"><h3>'+safe(title)+'</h3><span>'+safe(sub||'')+'</span></div>';}
function titleView(k,title,sub,extra){return '<div class="header-row"><div><div class="kicker">'+safe(k)+'</div><h1 class="page-title">'+safe(title)+'</h1><p class="page-sub">'+safe(sub)+'</p></div>'+(extra||'')+'</div>';}
function taskHTML(t){var can=owner(t.floor);return '<div class="item"><div class="item-head"><div><h4>'+safe(t.title)+'</h4><p>'+safe(t.detail)+'</p></div>'+pTag(t.status==='hecha'?'Completada':t.priority==='alta'?'Prioritaria':t.status,' '+(t.status==='hecha'?'done':t.priority==='alta'?'urgent':'active'))+'</div><div class="item-meta">'+pTag(fullName(t.floor))+pTag(dateLabel(t.due))+'</div><div class="item-actions">'+(can?(t.status==='hecha'?button('Reabrir','task:'+t.id,'small'):button(t.approval?'Aprobar':'Marcar realizada','task:'+t.id,'small primary'))+(t.status!=='hecha'?button('Recordar mañana','snooze:'+t.id,'small soft'):''):pTag('Solo consulta'))+'</div></div>';}
function caseHTML(c){var can=owner(c.stage);var i=STAGES.indexOf(c.stage);return '<div class="item"><div class="item-head"><div><h4>'+safe(c.id)+' · '+safe(c.client)+'</h4><p>'+safe(c.town)+' · '+safe(c.type)+'</p></div>'+pTag(c.stage==='cerrado'?'Cerrado':fullName(c.stage),c.stage==='cerrado'?'done':'')+'</div><div class="item-meta">'+pTag(c.status)+pTag(c.amount.toLocaleString('es-ES')+' € · ejemplo')+'</div>'+(can&&i<STAGES.length-1?'<div class="item-actions">'+button('Pasar a '+(STAGES[i+1]==='cerrado'?'cerrado':fullName(STAGES[i+1])),'advance:'+c.id,'small primary')+'</div>':'')+'</div>';}
function alertHTML(a){return '<div class="item" style="'+(!a.read?'border-color:#cadbe9;background:#f9fcff':'')+'"><div class="item-head"><div><h4>'+safe(a.title)+'</h4><p>'+safe(a.detail)+'</p></div>'+pTag(a.kind==='accion'?'Requiere acción':'Aviso',a.kind==='accion'?'urgent':'')+'</div><div class="item-meta">'+pTag(fullName(a.floor))+(a.read?pTag('Leída','done'):pTag('Nueva','active'))+'</div><div class="item-actions">'+(!a.read?button('Marcar leída','read:'+a.id,'small'):'')+button('Ir a planta','floor:'+a.floor,'small primary')+(a.kind==='aviso'?button('Descartar','dismiss:'+a.id,'small soft'):'')+'</div></div>';}
function navBtn(name,ico,label){return '<button class="nav-button '+(page===name?'active':'')+'" data-action="nav:'+name+'"><span class="nav-ico">'+ico+'</span>'+label+(name==='notifications'&&alertCount()?'<span class="nav-count">'+alertCount()+'</span>':'')+'</button>';}
function shell(body){
 var r=role();
 return '<div class="page shell"><aside class="sidebar"><div class="brand"><div class="brand-logo">K</div><div><strong>KONSOR</strong><small>OFICINA DIGITAL</small></div></div><div class="nav-label">ESPACIO DE TRABAJO</div><nav class="nav-group">'+navBtn('home','⌂','Inicio')+navBtn('building','▥','Edificio')+navBtn('tasks','☑','Mis tareas')+navBtn('notifications','♧','Centro de avisos')+navBtn('automation','✧','Automatizaciones')+navBtn('tracking','◎','Seguimiento')+'</nav><div class="side-bottom"><div class="identity"><small>SESIÓN DE PRUEBA</small><strong>'+safe(r.name)+'</strong><small>'+safe(r.desc)+'</small><button class="linklike" data-action="switchrole">Cambiar trabajador →</button><button class="linklike" style="display:block;margin-top:8px" data-action="resetdemo">Reiniciar datos de ejemplo</button></div><p style="font-size:10px;color:#90a0b0;line-height:1.5;padding:0 8px">Datos ficticios · las acciones no se envían a Firebase ni a otros empleados.</p></div></aside><div class="main"><header class="topbar"><div class="topbar-title">KONSOR <small>'+safe(r.name)+' · '+safe(dep(r.dept).name)+'</small></div><div class="top-actions"><span class="tag-demo">DEMO INTERACTIVA</span><button class="circle" aria-label="Cambiar perfil" data-action="switchrole">♙</button><button class="circle" aria-label="Ver avisos" data-action="nav:notifications">♧'+(alertCount()?'<span class="counter-dot">●</span>':'')+'</button></div></header><div class="content floor-screen">'+body+'</div></div><nav class="bottomnav"><button class="'+(page==='home'?'active':'')+'" data-action="nav:home"><span>⌂</span>Inicio</button><button class="'+(page==='building'?'active':'')+'" data-action="nav:building"><span>▥</span>Plantas</button><button class="'+(page==='tasks'?'active':'')+'" data-action="nav:tasks"><span>☑</span>Tareas</button><button class="'+(page==='notifications'?'active':'')+'" data-action="nav:notifications"><span>♧</span>Avisos</button><button class="'+(page==='automation'?'active':'')+'" data-action="nav:automation"><span>✧</span>IA</button></nav></div>';
}
function login(){
 return '<div class="login"><div class="login-panel"><div class="brand" style="padding-left:0"><div class="brand-logo">K</div><div><strong>KONSOR</strong><small>EDIFICIO · VERSIÓN DE PRUEBAS</small></div></div><div class="kicker">PRUEBA TODOS LOS DEPARTAMENTOS</div><h1>¿Como quién quieres entrar?</h1><p>Elige CEO, un jefe o un trabajador. Cada perfil verá diferentes plantas, herramientas, avisos y tareas. Puedes cambiar de perfil en cualquier momento.</p><div class="banner"><strong>Demostración real de interfaz.</strong> Los botones modifican tareas, avisos y expedientes ficticios en este navegador. No hay cuentas auténticas ni conexión con Firebase.</div><div class="profile-grid">'+ROLES.map(function(r){return '<button class="profile" data-action="enter:'+r.id+'"><span class="avatar">'+safe(r.avatar)+'</span><strong>'+safe(r.name)+'</strong><small>'+safe(r.desc)+'</small></button>';}).join('')+'</div></div></div>';
}
function home(){
 var r=role(),ownFloor=r.rank==='ceo'?'direccion':r.dept;var pendingOwn=pending(ownFloor);var activeCases=db.cases.filter(function(c){return c.stage===ownFloor;});
 var tasksDone=db.tasks.filter(function(t){return t.floor===ownFloor&&t.status==='hecha';}).length;
 var auto=AUTO.find(function(a){return a.floor===ownFloor;});
 var greeting=new Date().getHours()<13?'Buenos días':new Date().getHours()<21?'Buenas tardes':'Buenas noches';
 var result=titleView('TU ESPACIO PERSONAL',greeting+', '+r.name,'El trabajo pendiente, los avisos y los siguientes pasos de tu departamento.',button('Cambiar perfil','switchrole','small'));
 result+='<div class="glass"><div class="kicker">SIGUIENTE ACCIÓN RECOMENDADA · SIMULACIÓN</div><h2 class="hero-title">'+safe(pendingOwn.length?pendingOwn[0].title:'Todo revisado en tu departamento')+'</h2><p class="hero-copy">'+safe(pendingOwn.length?pendingOwn[0].detail:'No hay tareas abiertas. Puedes revisar expedientes o generar una planificación de ejemplo.')+'</p><div class="actions">'+button(pendingOwn.length?'Ir a mis tareas':'Ver planta','nav:'+(pendingOwn.length?'tasks':'building'),'primary')+button('Abrir mi planta','floor:'+ownFloor,'soft')+'</div></div>';
 result+='<div class="stats">'+stat(pendingOwn.length,'Tareas pendientes')+stat(tasksDone,'Tareas realizadas')+stat(activeCases.length,'Expedientes en mi planta')+stat(visibleAlerts().filter(function(a){return !a.read;}).length,'Avisos sin leer')+'</div>';
 result+='<div class="two-col"><div class="card"><h3 class="card-title">Trabajo prioritario</h3><p class="card-sub">Puedes completar tareas, posponerlas o acceder a su departamento.</p>'+(pendingOwn.slice(0,3).map(taskHTML).join('')||'<div class="empty">No hay tareas abiertas.</div>')+'<div style="margin-top:13px">'+button('Ver todas mis tareas','nav:tasks','small')+'</div></div><div class="card"><h3 class="card-title">Asistente del departamento</h3><p class="card-sub">Reglas automatizadas que puedes probar ahora mismo.</p><div class="notice">La ejecución es local y demostrativa: no se envían mensajes ni se ejecutan procesos en segundo plano.</div><div style="margin-top:13px">'+(auto?'<h4 style="font-size:13px;margin:0 0 8px">'+safe(auto.title)+'</h4><p class="page-sub">'+safe(auto.desc)+'</p><div style="margin-top:16px">'+button('Ejecutar simulación','run:'+auto.id,'primary')+'</div>':'')+'</div></div>';
 return result;
}
function building(){
 var result=titleView('ORGANIZACIÓN · CINCO PLANTAS','Edificio KONSOR','Cada planta tiene su bandeja, sus automatizaciones y un circuito de expedientes.','');
 result+='<div class="building"><div><div class="floor-list">'+DEPTS.map(function(d){var allowed=access(d.id);var qty=pending(d.id).length;return '<button class="floor-card" data-action="floor:'+d.id+'" '+(!allowed?'disabled aria-label="Sin acceso a '+safe(d.name)+'"':'')+'><div class="floor-num">'+d.num+'</div><div class="floor-copy"><strong>'+safe(d.name)+'</strong><span>'+safe(d.sub)+'</span><small>'+safe(d.desc)+'</small></div><span class="floor-end">'+(allowed?qty+' · ›':'🔒')+'</span></button>';}).join('')+'</div></div><div class="building-side"><div class="elevator"><div class="elevator-label">PLANTAS · KONSOR</div>'+DEPTS.map(function(d){return '<div class="lift-row '+(access(d.id)?'current':'')+'"><span>'+safe(d.name)+'</span><strong>'+d.num+'</strong></div>';}).join('')+'</div><div class="notice" style="margin-top:14px">Las plantas bloqueadas muestran la jerarquía del perfil seleccionado. Los permisos reales deberán validarse mediante Firebase.</div></div></div>';
 result+=section('Flujo de expedientes','De captación a cierre');
 result+='<div class="flow">'+STAGES.map(function(s){return '<span>'+safe(s==='cerrado'?'Cerrado':fullName(s))+'</span>';}).join('')+'</div>';
 return result;
}
function floorView(){
 if(!access(floor)){return '<div class="notice">Tu perfil no puede acceder a esta planta.</div>';}
 var d=dep(floor),tasks=pending(floor),cases=db.cases.filter(function(c){return c.stage===floor;});
 var result=titleView('PLANTA '+d.num+' · '+d.sub.toUpperCase(),d.name,d.desc,button('‹ Edificio','nav:building','small'));
 result+='<div class="tabs">'+[['resumen','Resumen'],['bandeja','Bandeja'],['expedientes','Expedientes'],['asistentes','Automatizaciones'],['equipo','Equipo y seguimiento']].map(function(v){return '<button data-action="tab:'+v[0]+'" class="'+(tab===v[0]?'active':'')+'">'+v[1]+'</button>';}).join('')+'</div>';
 if(tab==='resumen'){
  result+='<div class="stats">'+stat(tasks.length,'Pendientes')+stat(db.tasks.filter(function(t){return t.floor===floor&&t.status==='hecha';}).length,'Completadas')+stat(cases.length,'Expedientes activos')+stat(db.alerts.filter(function(a){return a.floor===floor&&!a.read;}).length,'Avisos nuevos')+'</div>';
  result+='<div class="two-col"><div class="card"><h3 class="card-title">Herramientas de '+safe(d.name)+'</h3><p class="card-sub">Acciones funcionales de esta versión de prueba.</p><div class="mini-grid">'+(ACTIONS[floor]||[]).map(function(x){return '<button class="quick" data-action="quick:'+x[2]+'"><span class="symbol">↗</span><strong>'+safe(x[0])+'</strong><small>'+safe(x[1])+'</small></button>';}).join('')+'</div></div><div class="card"><h3 class="card-title">Siguiente trabajo</h3><p class="card-sub">Atajos según el perfil actual.</p>'+(tasks.slice(0,2).map(taskHTML).join('')||'<div class="empty">Sin pendientes</div>')+'</div></div>';
 }else if(tab==='bandeja'){
  result+='<div class="card"><div class="header-row"><div><h3 class="card-title">Bandeja de '+safe(d.name)+'</h3><p class="card-sub">'+tasks.length+' tareas abiertas</p></div>'+button('+ Nueva tarea','create:task','small primary')+'</div>'+(visibleTasks(floor).map(taskHTML).join('')||'<div class="empty">No hay tareas registradas.</div>')+'</div>';
 }else if(tab==='expedientes'){
  result+='<div class="card"><div class="header-row"><div><h3 class="card-title">Expedientes del departamento</h3><p class="card-sub">Prueba el traspaso entre plantas y sus avisos asociados.</p></div>'+(floor==='comercial'?button('+ Captación','create:case','small primary'):'')+'</div>'+(cases.map(caseHTML).join('')||'<div class="empty">Sin expedientes en esta etapa.</div>')+'</div>';
 }else if(tab==='asistentes'){
  result+=autoList(floor);
 }else {
  result+=teamView();
 }
 return result;
}
function teamView(){
 var r=role(),my=owner(floor),list=visibleTasks(floor),done=list.filter(function(t){return t.status==='hecha';}).length;
 var result='<div class="two-col"><div class="card"><h3 class="card-title">Seguimiento del departamento</h3><p class="card-sub">Actividad creada y cerrada dentro de la demostración.</p><div class="stats" style="grid-template-columns:repeat(2,minmax(0,1fr))">'+stat(done,'Resueltas')+stat(list.length,'Totales')+'</div><div class="notice">Acceso de responsable: '+(my?'puedes organizar el trabajo de tu departamento.':'consulta limitada para dirección.')+'</div>'+button('Crear tarea','create:task','small primary')+'</div><div class="card"><h3 class="card-title">Registro de actividad</h3><p class="card-sub">Cada acción queda apuntada en la demo.</p><div class="timeline">'+db.logs.slice(0,7).map(function(l){return '<div class="event"><strong>'+safe(l.title)+'</strong><p>'+safe(l.detail)+'</p></div>';}).join('')+'</div></div></div>';
 return result;
}
function taskView(){
 var r=role(),allowed=DEPTS.filter(function(d){return access(d.id);}).map(function(d){return d.id;});
 var all=db.tasks.filter(function(t){return allowed.indexOf(t.floor)>=0&&(r.rank==='ceo'||r.rank==='jefe'||t.floor===r.dept);});
 if(taskFilter==='abiertas')all=all.filter(function(t){return t.status!=='hecha';});
 if(taskFilter==='cerradas')all=all.filter(function(t){return t.status==='hecha';});
 return titleView('TRABAJO GUIADO','Bandeja de tareas','Completa, pospone y crea tareas. Los cambios se conservan en esta demostración.','')+'<div class="tabs">'+[['abiertas','Abiertas'],['todas','Todas'],['cerradas','Completadas']].map(function(f){return '<button class="'+(taskFilter===f[0]?'active':'')+'" data-action="filter:'+f[0]+'">'+f[1]+'</button>';}).join('')+'</div><div class="card"><div class="header-row"><div><h3 class="card-title">'+all.length+' tareas</h3><p class="card-sub">Mostrando únicamente departamentos permitidos.</p></div>'+button('+ Añadir tarea','create:task','small primary')+'</div>'+(all.map(taskHTML).join('')||'<div class="empty">No hay tareas en este filtro.</div>')+'</div>';
}
function notifications(){
 var alerts=visibleAlerts().filter(function(a){return selectedAlert==='all'||a.kind===selectedAlert;});
 return titleView('CENTRO DE COMUNICACIONES','Avisos y acciones','Los avisos informativos se pueden descartar; los que requieren trabajo permanecen en la bandeja.','')+'<div class="tabs">'+[['all','Todos'],['aviso','Solo avisos'],['accion','Requieren acción']].map(function(f){return '<button class="'+(selectedAlert===f[0]?'active':'')+'" data-action="alertfilter:'+f[0]+'">'+f[1]+'</button>';}).join('')+'</div><div class="card"><div class="header-row"><div><h3 class="card-title">Centro de avisos</h3><p class="card-sub">'+alerts.length+' registros visibles</p></div>'+button('Marcar todos leídos','readall','small')+'</div>'+(alerts.map(alertHTML).join('')||'<div class="empty">No quedan avisos en este filtro.</div>')+'</div>';
}
function autoList(deptFilter){
 var autos=AUTO.filter(function(a){return (deptFilter?a.floor===deptFilter:access(a.floor));});
 return '<div class="card"><h3 class="card-title">Automatizaciones del departamento</h3><p class="card-sub">Activar una regla habilita su ejecución manual de prueba. En esta demo no hay trabajos programados ni avisos push reales.</p>'+autos.map(function(a){return '<div class="item"><div class="item-head"><div><h4>'+safe(a.title)+'</h4><p>'+safe(a.desc)+'</p></div>'+pTag(db.toggles[a.id]?'Activada':'Desactivada',db.toggles[a.id]?'done':'')+'</div><div class="item-meta">'+pTag(fullName(a.floor))+'</div><div class="item-actions">'+button(db.toggles[a.id]?'Desactivar':'Activar','toggle:'+a.id,'small')+button('Ejecutar prueba','run:'+a.id,'small primary')+'</div></div>';}).join('')+'</div>';
}
function automation(){
 return titleView('MOTOR OPERATIVO · PRUEBAS','Automatizaciones','Simula qué acciones preparará KONSOR cuando esté conectado a sus servicios reales.','')+'<div class="banner">Las automatizaciones de esta vista se ejecutan solo al tocar «Ejecutar prueba». No se ejecutan en segundo plano ni llaman a Gemini, Firestore, WhatsApp o sistemas externos.</div>'+autoList(null);
}
function tracking(){
 var visible=db.cases.filter(function(c){return access(c.stage)||role().rank==='ceo';});
 return titleView('TRAZABILIDAD','Seguimiento de expedientes','Comprueba cómo una ficha pasa de un departamento al siguiente y genera una tarea de recepción.',button('Simular día siguiente','nextday','small'))+'<div class="card"><h3 class="card-title">Circuito completo</h3><p class="card-sub">Selecciona expedientes de las plantas permitidas y avanza el proceso cuando tengas autorización.</p><div class="flow" style="margin-bottom:20px">'+STAGES.map(function(s){return '<span>'+safe(s==='cerrado'?'Cerrado':fullName(s))+'</span>';}).join('')+'</div>'+(visible.map(caseHTML).join('')||'<div class="empty">Sin expedientes visibles.</div>')+'</div>'+section('Historial de acciones','Últimos movimientos')+'<div class="card"><div class="timeline">'+db.logs.slice(0,12).map(function(l){return '<div class="event"><strong>'+safe(l.title)+'</strong><p>'+safe(l.detail)+'</p></div>';}).join('')+'</div></div>';
}
function finance(){
 var cases=db.cases.filter(function(c){return c.stage==='administracion'||c.stage==='direccion'||c.stage==='cerrado';});
 var value=cases.reduce(function(n,c){return n+c.amount;},0);
 return titleView('PLANTA 04 · CIFRAS FICTICIAS','Control económico','Este panel es orientativo. No hay facturas ni cobros reales conectados.','')+'<div class="stats">'+stat(value.toLocaleString('es-ES')+' €','Valor estimado')+stat(cases.length,'Expedientes posteriores a obra')+stat(pending('administracion').length,'Controles pendientes')+stat('0 €','Cobros reales conectados')+'</div><div class="card"><h3 class="card-title">Revisión económica</h3><p class="card-sub">Completa las tareas y genera controles de prueba.</p>'+visibleTasks('administracion').map(taskHTML).join('')+button('Generar revisión de cobros','run:finance','primary')+'</div>';
}
function render(){
 var target=document.getElementById('app'),body='';
 if(page==='login'||!db.profile){target.innerHTML=login();return;}
 if(page==='home')body=home();
 else if(page==='building')body=building();
 else if(page==='floor')body=floorView();
 else if(page==='tasks')body=taskView();
 else if(page==='notifications')body=notifications();
 else if(page==='automation')body=automation();
 else if(page==='tracking')body=tracking();
 else if(page==='finances')body=finance();
 else body=home();
 target.innerHTML=shell(body);
}
function createModal(kind){
 modal=kind;
 var isCase=kind==='case',where=page==='floor'?floor:(role().rank==='ceo'?'direccion':role().dept);
 var title=isCase?'Nueva captación':'Nueva tarea';
 var html='<div class="overlay" id="modal-overlay"><div class="modal" role="dialog" aria-modal="true"><div class="modal-head"><h3>'+title+'</h3><button class="circle" data-action="closemodal" aria-label="Cerrar">×</button></div><form id="create-form"><div class="form-grid">';
 if(isCase){
  html+='<div class="field"><label>Cliente o inmueble de ejemplo</label><input name="name" required maxlength="70" placeholder="Vivienda · Calle Mayor"></div><div class="field"><label>Pueblo</label><input name="town" required maxlength="50" placeholder="Mutilva"></div><div class="field"><label>Tipo</label><select name="type"><option>Unifamiliar</option><option>Comunidad</option><option>Urbanización</option></select></div>';
 }else{
  html+='<div class="field"><label>Título de la tarea</label><input name="title" required maxlength="90" placeholder="Revisar expediente"></div><div class="field"><label>Descripción</label><textarea name="detail" maxlength="180" placeholder="Qué hay que hacer"></textarea></div><div class="field"><label>Departamento</label><select name="floor">'+DEPTS.filter(function(d){return owner(d.id);}).map(function(d){return '<option value="'+d.id+'" '+(d.id===where?'selected':'')+'>'+safe(d.name)+'</option>';}).join('')+'</select></div><div class="field"><label>Prioridad</label><select name="priority"><option value="normal">Normal</option><option value="alta">Alta</option></select></div>';
 }
 html+='</div><div class="actions" style="margin-top:20px"><button type="submit" class="button primary">Guardar en demo</button><button type="button" class="button" data-action="closemodal">Cancelar</button></div><p class="page-sub" style="margin-top:13px">No se enviarán datos a Firebase.</p></form></div></div>';
 document.getElementById('modal-root').innerHTML=html;
 document.getElementById('create-form').addEventListener('submit',function(e){
  e.preventDefault();var f=new FormData(e.currentTarget);
  if(isCase){
   var v={id:'EX-'+(++db.nextId),client:String(f.get('name')||'').trim(),town:String(f.get('town')||'').trim(),type:String(f.get('type')),stage:'comercial',status:'Captación',amount:0};
   if(!v.client||!v.town)return;db.cases.unshift(v);log('Captación creada',v.id+' · '+v.client);notify('comercial','accion','Nueva captación',v.id+' necesita seguimiento.');
  }else{
   var t={id:'t'+(++db.nextId),title:String(f.get('title')||'').trim(),detail:String(f.get('detail')||'').trim()||'Sin descripción',floor:String(f.get('floor')||where),status:'pendiente',priority:String(f.get('priority')||'normal'),due:db.day};
   if(!t.title||!owner(t.floor))return;db.tasks.unshift(t);log('Tarea creada',t.title+' · '+fullName(t.floor));notify(t.floor,'accion','Tarea nueva',t.title);
  }
  save();document.getElementById('modal-root').innerHTML='';modal='';render();showToast(isCase?'Ficha de ejemplo creada':'Tarea añadida a la demo');
 });
}
function advance(id){
 var c=db.cases.find(function(c){return c.id===id;});if(!c)return;
 if(c.stage==='cerrado'||!owner(c.stage)){showToast('No tienes permisos en esta etapa');return;}
 var next=STAGES[STAGES.indexOf(c.stage)+1];var old=c.stage;c.stage=next;c.status=next==='cerrado'?'Cerrado':'Pendiente de '+fullName(next);
 if(next!=='cerrado'){
  db.tasks.unshift({id:'t'+(++db.nextId),floor:next,title:'Recibir '+c.id+' · '+c.client,detail:'Transferido desde '+fullName(old),status:'pendiente',priority:'alta',due:db.day});
  notify(next,'accion','Nuevo expediente recibido',c.id+' llega desde '+fullName(old));
 }else notify('direccion','aviso','Expediente cerrado',c.id+' ha finalizado su circuito.');
 log('Traspaso de expediente',c.id+' · '+fullName(old)+' → '+(next==='cerrado'?'Cerrado':fullName(next)));save();render();showToast('Expediente transferido');
}
function runAutomation(id){
 var a=AUTO.find(function(a){return a.id===id;});
 if(!a||!access(a.floor)||!db.toggles[id]){showToast('Regla no disponible o desactivada');return;}
 var names={plan:'Propuesta de planificación',audit:'Incidencias detectadas',recall:'Seguimientos comerciales',route:'Rutas técnicas pendientes',docs:'Revisión documental',finance:'Revisión económica'};
 var subjects={plan:'Preparar calendario semanal por departamentos',audit:'Revisar cuellos de botella y resultados',recall:'Llamar a interesados sin respuesta',route:'Ordenar visitas y mediciones de la jornada',docs:'Solicitar documentación pendiente',finance:'Validar cobros y facturas de la semana'};
 var target=a.floor;
 db.tasks.unshift({id:'t'+(++db.nextId),floor:target,title:subjects[id],detail:'Creado por la simulación de '+a.title,status:'pendiente',priority:'normal',due:db.day+1});
 notify(target,'accion',names[id],subjects[id]);
 log('Automatización simulada',a.title+' ha generado una tarea y un aviso en '+fullName(target));
 save();render();showToast('Simulación ejecutada: tarea + aviso creados');
}
function onAction(key){
 if(!key)return;
 var p=key.split(':'),a=p[0],id=p.slice(1).join(':');
 if(a==='enter'){if(!ROLES.some(function(r){return r.id===id;}))return;db.profile=id;save();go('home');return;}
 if(a==='switchrole'){page='login';render();return;}if(a==='resetdemo'){if(!confirm('¿Restablecer los datos ficticios de esta demostración?'))return;var current=db.profile;db=seed();db.profile=current;selectedAlert='all';taskFilter='abiertas';save();go('home');showToast('Datos de ejemplo restaurados');return;}
 if(a==='nav'){go(id);return;}
 if(a==='floor'){if(!access(id)){showToast('Planta restringida para este perfil');return;}go('floor',id);return;}
 if(a==='tab'){tab=id;render();return;}
 if(a==='filter'){taskFilter=id;render();return;}
 if(a==='alertfilter'){selectedAlert=id;render();return;}
 if(a==='task'){
  var t=db.tasks.find(function(t){return t.id===id;});if(!t||!owner(t.floor)){showToast('No puedes modificar esta tarea');return;}
  t.status=t.status==='hecha'?'pendiente':'hecha';log('Tarea '+(t.status==='hecha'?'completada':'reabierta'),t.title);save();render();showToast('Estado actualizado');return;
 }
 if(a==='snooze'){
  var t2=db.tasks.find(function(t){return t.id===id;});if(!t2||!owner(t2.floor))return;t2.due=db.day+1;log('Recordatorio aplazado',t2.title+' · mañana');save();render();showToast('Recordatorio movido a mañana');return;
 }
 if(a==='read'){var al=db.alerts.find(function(x){return x.id===id;});if(al&&access(al.floor)){al.read=true;save();render();}return;}
 if(a==='dismiss'){db.alerts=db.alerts.filter(function(x){return !(x.id===id&&x.kind==='aviso'&&access(x.floor));});save();render();return;}
 if(a==='readall'){visibleAlerts().forEach(function(x){x.read=true;});save();render();return;}
 if(a==='advance'){advance(id);return;}
 if(a==='run'){runAutomation(id);return;}
 if(a==='toggle'){if(AUTO.some(function(x){return x.id===id&&access(x.floor);}))db.toggles[id]=!db.toggles[id];save();render();return;}
 if(a==='create'){if(id==='case'&&!owner('comercial')){showToast('Solo Comercial puede crear captaciones');return;}createModal(id);return;}
 if(a==='closemodal'){document.getElementById('modal-root').innerHTML='';modal='';return;}
 if(a==='nextday'){db.day++;db.tasks.filter(function(t){return t.status!=='hecha'&&t.due<db.day;}).forEach(function(t){notify(t.floor,'aviso','Recordatorio vencido',t.title);});log('Avance de jornada','Día de prueba '+db.day+' · avisos actualizados');save();render();showToast('Se ha simulado un día más');return;}
 if(a==='quick'){
  if(id==='newcase'){createModal('case');return;}
  if(id==='newtask'){createModal('task');return;}
  if(id==='plan'||id==='audit'){runAutomation(id);return;}
  if(id==='finances'){page='finances';render();return;}
  if(id==='tasks'){tab='bandeja';render();return;}
  if(id==='cases'){tab='expedientes';render();return;}
 }
}
document.addEventListener('click',function(e){
 var target=e.target.closest('[data-action]');if(!target||target.disabled)return;
 e.preventDefault();onAction(target.getAttribute('data-action'));
});
document.addEventListener('keydown',function(e){
 if(e.key==='Escape'&&modal){document.getElementById('modal-root').innerHTML='';modal='';}
});
var startX=0,startY=0;
document.addEventListener('touchstart',function(e){if(e.touches.length!==1||e.touches[0].clientX>38){startX=-1;return;}startX=e.touches[0].clientX;startY=e.touches[0].clientY;},{passive:true});
document.addEventListener('touchend',function(e){if(startX<0||!db.profile)return;var t=e.changedTouches[0];if(t.clientX-startX>85&&Math.abs(t.clientY-startY)<65){if(page==='floor')go('building');else if(page!=='home')go('home');}startX=-1;},{passive:true});
render();
})();
</script></body></html>
